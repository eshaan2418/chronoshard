name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -count=1 ./...

  prometheus-conformance:
    # Differential test: identical data pushed to chronoshard and a real
    # Prometheus; 47 queries compared as instant and range queries.
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: 3.15.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Prometheus
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz | tar xz
          echo "$PWD/prometheus-${PROM_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - run: for s in 1 2 3; do SEED=$s OUT=/tmp/conf$s.json VERBOSE=1 ./scripts/conformance.sh; done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
